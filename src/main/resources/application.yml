github:
  clienid: ${GITHUB_CLIENT_ID:}
  client_secret: ${GITHUB_CLIENT_SECRET:}
  redirect_uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/callback}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql:///community?useUnicode=true&characterEncoding=utf-8&useSSL=false}
    password: ${DB_PASSWORD:}
    username: ${DB_USERNAME:root}
    driver-class-name: com.mysql.jdbc.Driver
#  mvc:
#    throw-exception-if-no-handler-found: true
logging:
  level:
    #top.aftery.community.mapper: debug
    top.aftery.community.mapper: debug
  file:
    #单个日志文件最大5mb
    max-size: 5MB
    #最多有20（天）个日志记录
    max-history: 20
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

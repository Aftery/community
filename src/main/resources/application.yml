github:
  # 仅填 Client ID（如 f88879001d2eec8aa7d6），完整的 authorize URL 由后端拼
  clienid: f88879001d2eec8aa7d6
  # 填 GitHub OAuth App 的 Client Secret，敏感信息建议放到 application-local.yml 覆盖
  client_secret: YOUR_CLIENT_SECRET_HERE
  redirect_uri: http://localhost:8080/callback
spring:
  # 账号密码等本地连接信息放在 application-local.yml，该文件不纳入版本管理
  profiles:
    active: local
  datasource:
    url: jdbc:mysql:///community?useUnicode=true&characterEncoding=utf-8&useSSL=false
    driver-class-name: com.mysql.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 4MB
upload:
  dir: ./upload/
#  mvc:
#    throw-exception-if-no-handler-found: true
logging:
  level:
    #top.aftery.community.mapper: debug
    top.aftery.community.mapper: debug
  file:
    #单个日志文件最大5mb
    max-size: 5MB
    #最多有20（天）个日志记录
    max-history: 20
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql
